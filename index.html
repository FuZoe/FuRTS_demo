<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuRTS - 文字版即时战略游戏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  color: #0f0;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  user-select: none;
}
#gameCanvas {
  display: block;
  cursor: crosshair;
}
#hud {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 36px;
  background: rgba(0,0,0,0.85);
  border-bottom: 1px solid #0a0;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 14px;
  z-index: 10;
  gap: 24px;
}
.hud-item { white-space: nowrap; }
.hud-label { color: #0a0; }
.hud-value { color: #0f0; font-weight: bold; }
#hudIdleWorkers {
  display: none;
  cursor: pointer;
}
#hudIdleWorkers:hover .hud-label,
#hudIdleWorkers:hover .hud-value {
  color: #ff0;
}
#sidebar {
  position: fixed;
  top: 36px;
  right: 0;
  width: 220px;
  bottom: 0;
  background: rgba(0,0,0,0.85);
  border-left: 1px solid #0a0;
  padding: 10px;
  font-size: 12px;
  z-index: 10;
  overflow-y: auto;
}
#sidebar h3 {
  color: #0f0;
  margin-bottom: 6px;
  border-bottom: 1px solid #0a0;
  padding-bottom: 4px;
}
.btn {
  display: block;
  width: 100%;
  margin: 4px 0;
  padding: 6px 8px;
  background: #020;
  color: #0f0;
  border: 1px solid #0a0;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  text-align: left;
}
.btn:hover { background: #040; }
.btn:disabled { color: #050; border-color: #030; cursor: not-allowed; }
.btn .cost { color: #0a0; float: right; }
.btn .btn-key { color: #ff0; font-weight: bold; margin-right: 2px; }
#groupBar { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; padding-top: 4px; }
.grp-btn {
  width: 22px; height: 22px;
  background: #020; color: #555;
  border: 1px solid #333; cursor: pointer;
  font: bold 11px 'Courier New', monospace;
  text-align: center; line-height: 20px;
  padding: 0; position: relative;
}
.grp-btn.active { color: #ff0; border-color: #ff0; background: #220; position: relative; }
.grp-btn.selected { color: #fff; border-color: #fff; background: #030; }
.grp-btn .grp-count {
  position: absolute;
  top: -5px; right: -5px;
  font-size: 8px; color: #0f0;
  background: #020; border: 1px solid #0a0;
  border-radius: 6px; padding: 0 2px;
  line-height: 12px; min-width: 12px;
  text-align: center; z-index: 1;
}
.grp-btn.flash { animation: grpFlash 0.3s; }
@keyframes grpFlash { 0%,100%{background:#220;} 50%{background:#0a0;} }
#info {
  margin-top: 10px;
  padding-top: 6px;
  border-top: 1px solid #0a0;
  line-height: 1.6;
}
.selection-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, 30px);
  gap: 4px;
  margin-top: 6px;
}
.selection-icon {
  position: relative;
  width: 30px;
  height: 30px;
  padding: 0;
  background: #020;
  border: 1px solid #0a0;
  color: #0f0;
  cursor: pointer;
  font: bold 14px 'Courier New', monospace;
  line-height: 26px;
  text-align: center;
}
.selection-icon:hover {
  background: #040;
  border-color: #0f0;
}
.selection-icon .hp-track {
  position: absolute;
  left: 2px;
  right: 2px;
  bottom: 2px;
  height: 3px;
  background: #300;
}
.selection-icon .hp-fill {
  display: block;
  height: 100%;
}
#minimap {
  margin-top: 10px;
  border: 1px solid #0a0;
  background: #000;
}
#log {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 220px;
  height: 80px;
  background: rgba(0,0,0,0.85);
  border-top: 1px solid #0a0;
  padding: 4px 10px;
  font-size: 11px;
  overflow-y: auto;
  z-index: 10;
  color: #0a0;
}
.guide-section { margin-top: 8px; }
.guide-section h4 {
  color: #0f0;
  font-size: 11px;
  margin-bottom: 4px;
  border-bottom: 1px solid #030;
  padding-bottom: 2px;
}
.guide-row {
  display: flex;
  font-size: 11px;
  line-height: 1.6;
}
.guide-key {
  color: #ff0;
  min-width: 65px;
  font-weight: bold;
}
.guide-desc { color: #0a0; }

/* ---- 地图选择 overlay ---- */
#mapSelectOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  color: #0f0;
}
#mapSelectInner {
  background: #050805;
  border: 1px solid #0a0;
  padding: 28px 32px 24px;
  max-width: 760px;
  width: 90%;
  box-shadow: 0 0 24px rgba(0, 255, 0, 0.2);
}
#mapSelectInner h2 {
  font-size: 22px;
  color: #0f0;
  margin-bottom: 6px;
  text-align: center;
  letter-spacing: 2px;
}
#mapSelectInner .map-tagline {
  color: #0a0;
  font-size: 12px;
  text-align: center;
  margin-bottom: 18px;
}
#mapCardsContainer {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  justify-content: center;
}
.map-card {
  width: 220px;
  background: #020;
  border: 1px solid #0a0;
  padding: 10px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.15s;
  text-align: center;
}
.map-card:hover {
  background: #041004;
  border-color: #0f0;
  transform: translateY(-2px);
}
.map-card canvas {
  display: block;
  width: 200px;
  height: 150px;
  background: #000;
  border: 1px solid #050;
  margin: 0 auto 8px;
  image-rendering: pixelated;
}
.map-card-title {
  color: #0f0;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 4px;
}
.map-card-desc {
  color: #0a0;
  font-size: 11px;
  line-height: 1.5;
  min-height: 32px;
}
.map-card-size {
  color: #ff0;
  font-size: 10px;
  margin-top: 4px;
}
</style>
<link rel="stylesheet" href="hotkeys.css">
</head>
<body>
<div id="hud">
  <span class="hud-item"><span class="hud-label">矿石: </span><span class="hud-value" id="hudMinerals">200</span></span>
  <span class="hud-item"><span class="hud-label">人口: </span><span class="hud-value" id="hudPop">0/10</span></span>
  <span class="hud-item"><span class="hud-label">单位: </span><span class="hud-value" id="hudUnits">0</span></span>
  <span class="hud-item"><span class="hud-label">敌军: </span><span class="hud-value" id="hudEnemies">0</span></span>
  <span class="hud-item"><span class="hud-label">时间: </span><span class="hud-value" id="hudTime">00:00</span></span>
  <span class="hud-item"><span class="hud-label">速度: </span><span class="hud-value" id="hudSpeed">1x</span></span>
  <span class="hud-item" id="hudIdleWorkers" onclick="selectIdleWorkers()" title="点击选中空闲工人">
    <span class="hud-label">闲置: </span><span class="hud-value" id="hudIdleCount">0</span>
  </span>
  <span class="hud-item" style="margin-left:auto;color:#0a0;font-size:12px;">左键选择/框选 | 右键指令 | Ctrl/Shift/Alt+数字编队</span>
</div>
<canvas id="gameCanvas"></canvas>
<div id="sidebar">
  <div id="groupBar"></div>
  <h3>📋 选中信息</h3>
  <div id="info">未选中任何单位</div>
  <h3 style="margin-top:10px;">🎮 操作面板</h3>
  <div id="actions"></div>
  <div id="guide"></div>
  <h3 style="margin-top:10px;">🗺️ 小地图</h3>
  <canvas id="minimap" width="200" height="150"></canvas>
</div>
<div id="log"></div>

<!-- 地图选择 overlay (开局显示, 选择后隐藏) -->
<div id="mapSelectOverlay">
  <div id="mapSelectInner">
    <h2>FuRTS - 选择地图</h2>
    <div class="map-tagline">点击下方任一地图卡片开始游戏</div>
    <div id="mapCardsContainer"></div>
  </div>
</div>

<script src="map.js"></script>
<script src="entities.js"></script>
<script src="audio.js"></script>
<script src="hotkeys.js"></script>
<script src="game.js"></script>
<script src="render.js"></script>
<script src="ui.js"></script>
<script src="commands.js"></script>
<script src="input.js"></script>
<script src="enemy_ai.js"></script>
</body>
</html>

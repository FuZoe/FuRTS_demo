<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuRTS - 文字版即时战略游戏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  color: #0f0;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  user-select: none;
}
#gameCanvas {
  display: block;
  cursor: crosshair;
}
#hud {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 36px;
  background: rgba(0,0,0,0.85);
  border-bottom: 1px solid #0a0;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 14px;
  z-index: 10;
  gap: 24px;
}
.hud-item { white-space: nowrap; }
.hud-label { color: #0a0; }
.hud-value { color: #0f0; font-weight: bold; }
#sidebar {
  position: fixed;
  top: 36px;
  right: 0;
  width: 220px;
  bottom: 0;
  background: rgba(0,0,0,0.85);
  border-left: 1px solid #0a0;
  padding: 10px;
  font-size: 12px;
  z-index: 10;
  overflow-y: auto;
}
#sidebar h3 {
  color: #0f0;
  margin-bottom: 6px;
  border-bottom: 1px solid #0a0;
  padding-bottom: 4px;
}
.btn {
  display: block;
  width: 100%;
  margin: 4px 0;
  padding: 6px 8px;
  background: #020;
  color: #0f0;
  border: 1px solid #0a0;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  text-align: left;
}
.btn:hover { background: #040; }
.btn:disabled { color: #050; border-color: #030; cursor: not-allowed; }
.btn .cost { color: #0a0; float: right; }
.btn .btn-key { color: #ff0; font-weight: bold; margin-right: 2px; }
#groupBar { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; padding-top: 4px; }
.grp-btn {
  width: 22px; height: 22px;
  background: #020; color: #555;
  border: 1px solid #333; cursor: pointer;
  font: bold 11px 'Courier New', monospace;
  text-align: center; line-height: 20px;
  padding: 0; position: relative;
}
.grp-btn.active { color: #ff0; border-color: #ff0; background: #220; position: relative; }
.grp-btn.selected { color: #fff; border-color: #fff; background: #030; }
.grp-btn .grp-count {
  position: absolute;
  top: -5px; right: -5px;
  font-size: 8px; color: #0f0;
  background: #020; border: 1px solid #0a0;
  border-radius: 6px; padding: 0 2px;
  line-height: 12px; min-width: 12px;
  text-align: center; z-index: 1;
}
.grp-btn.flash { animation: grpFlash 0.3s; }
@keyframes grpFlash { 0%,100%{background:#220;} 50%{background:#0a0;} }
#info {
  margin-top: 10px;
  padding-top: 6px;
  border-top: 1px solid #0a0;
  line-height: 1.6;
}
#minimap {
  margin-top: 10px;
  border: 1px solid #0a0;
  background: #000;
}
#log {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 220px;
  height: 80px;
  background: rgba(0,0,0,0.85);
  border-top: 1px solid #0a0;
  padding: 4px 10px;
  font-size: 11px;
  overflow-y: auto;
  z-index: 10;
  color: #0a0;
}
.guide-section { margin-top: 8px; }
.guide-section h4 {
  color: #0f0;
  font-size: 11px;
  margin-bottom: 4px;
  border-bottom: 1px solid #030;
  padding-bottom: 2px;
}
.guide-row {
  display: flex;
  font-size: 11px;
  line-height: 1.6;
}
.guide-key {
  color: #ff0;
  min-width: 65px;
  font-weight: bold;
}
.guide-desc { color: #0a0; }
</style>
</head>
<body>
<div id="hud">
  <span class="hud-item"><span class="hud-label">矿石: </span><span class="hud-value" id="hudMinerals">200</span></span>
  <span class="hud-item"><span class="hud-label">人口: </span><span class="hud-value" id="hudPop">0/10</span></span>
  <span class="hud-item"><span class="hud-label">单位: </span><span class="hud-value" id="hudUnits">0</span></span>
  <span class="hud-item"><span class="hud-label">敌军: </span><span class="hud-value" id="hudEnemies">0</span></span>
  <span class="hud-item"><span class="hud-label">时间: </span><span class="hud-value" id="hudTime">00:00</span></span>
  <span class="hud-item" style="margin-left:auto;color:#0a0;font-size:12px;">左键选择/框选 | 右键指令 | Ctrl/Shift/Alt+数字编队</span>
</div>
<canvas id="gameCanvas"></canvas>
<div id="sidebar">
  <div id="groupBar"></div>
  <h3>📋 选中信息</h3>
  <div id="info">未选中任何单位</div>
  <h3 style="margin-top:10px;">🎮 操作面板</h3>
  <div id="actions"></div>
  <div id="guide"></div>
  <h3 style="margin-top:10px;">🗺️ 小地图</h3>
  <canvas id="minimap" width="200" height="150"></canvas>
</div>
<div id="log"></div>

<script src="map.js"></script>
<script src="entities.js"></script>
<script>
// ============================================================
//  FuRTS - 系统界面 / 渲染 / 输入 / 游戏循环
//  依赖: map.js, entities.js
// ============================================================

// ---- 界面常量 ----
const SIDEBAR_W = 220;
const HUD_H = 36;
const LOG_H = 80;
const GATHER_AMOUNT = 5;
const GATHER_TIME = 90;
const BUILD_RANGE = 3;

// ---- Canvas初始化 ----
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth - SIDEBAR_W;
  canvas.height = window.innerHeight - HUD_H;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ---- 相机 ----
const camera = { x: 0, y: 0 };
function clampCamera() {
  const maxX = MAP_W * CELL - canvas.width;
  const maxY = MAP_H * CELL - canvas.height + LOG_H;
  camera.x = Math.max(0, Math.min(camera.x, maxX));
  camera.y = Math.max(0, Math.min(camera.y, maxY));
}

// ---- 游戏状态 ----
const game = {
  minerals: 200,
  pop: 0,
  maxPop: 10,
  frame: 0,
  selected: [],
  controlGroups: {},
  dragStart: null,
  dragEnd: null,
  buildMode: null,
  buildPreview: null,
  paused: false,
  gameOver: false,
  scrollSpeed: 8,
  keysDown: {},
};

// ---- 初始单位 ----
const playerBase = createBuilding('base', MAP_W - 6, MAP_H - 6, TEAM_PLAYER);
createUnit('worker', MAP_W - 8, MAP_H - 5, TEAM_PLAYER);
createUnit('worker', MAP_W - 8, MAP_H - 7, TEAM_PLAYER);
createUnit('worker', MAP_W - 4, MAP_H - 7, TEAM_PLAYER);

const enemyBase = createBuilding('base', 3, 3, TEAM_ENEMY);
createUnit('worker', 6, 4, TEAM_ENEMY);
createUnit('worker', 6, 6, TEAM_ENEMY);
createUnit('soldier', 8, 5, TEAM_ENEMY);

// 移动相机到玩家基地
camera.x = playerBase.x - canvas.width / 2;
camera.y = playerBase.y - canvas.height / 2;
clampCamera();

// ---- 日志系统 ----
const logEl = document.getElementById('log');
const logMessages = [];
function addLog(msg) {
  const time = formatTime(game.frame);
  logMessages.push(`[${time}] ${msg}`);
  if (logMessages.length > 50) logMessages.shift();
  logEl.innerHTML = logMessages.map(m => `<div>${m}</div>`).join('');
  logEl.scrollTop = logEl.scrollHeight;
}
function formatTime(frame) {
  const s = Math.floor(frame / 60);
  const m = Math.floor(s / 60);
  return `${String(m).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
}

addLog('⚔️ FuRTS 启动！操作指南见右侧边栏。');

// ---- 人口计算 ----
function countPop() {
  let pop = 0;
  for (const e of entities) {
    if (e.team === TEAM_PLAYER && e.hp > 0 && e.kind === 'unit') {
      pop += UNIT_DEFS[e.type].popCost;
    }
  }
  let maxPop = 10;
  for (const e of entities) {
    if (e.team === TEAM_PLAYER && e.hp > 0 && e.kind === 'building' && e.type === 'supply' && e.buildProgress >= e.maxHp) {
      maxPop += 10;
    }
  }
  game.pop = pop;
  game.maxPop = maxPop;
}

// ---- 更新逻辑 ----
function update() {
  if (game.paused || game.gameOver) return;
  game.frame++;

  // 键盘滚动
  if (game.keysDown['ArrowLeft'] || game.keysDown['a']) camera.x -= game.scrollSpeed;
  if (game.keysDown['ArrowRight'] || game.keysDown['d']) camera.x += game.scrollSpeed;
  if (game.keysDown['ArrowUp'] || game.keysDown['w']) camera.y -= game.scrollSpeed;
  if (game.keysDown['ArrowDown'] || game.keysDown['s']) camera.y += game.scrollSpeed;
  clampCamera();

  for (const e of entities) {
    if (e.hp <= 0) continue;

    // -- 建筑逻辑 --
    if (e.kind === 'building') {
      if (e.buildProgress < e.maxHp) continue;
      // 防御塔自动攻击
      if (e.type === 'tower') {
        const enemy = findNearestEnemy(e, 6);
        if (enemy && game.frame % 30 === 0) {
          enemy.hp -= 20;
          if (enemy.hp <= 0) addLog(`防御塔消灭了 ${UNIT_DEFS[enemy.type]?.char || '敌人'}`);
        }
      }
      // 生产队列
      if (e.queue.length > 0) {
        e.queueTimer++;
        const producing = e.queue[0];
        const def = UNIT_DEFS[producing];
        if (e.queueTimer >= def.buildTime) {
          const spawnX = e.gx + (e.team === TEAM_PLAYER ? -2 : 3);
          const spawnY = e.gy + 1;
          createUnit(producing, spawnX, spawnY, e.team);
          e.queue.shift();
          e.queueTimer = 0;
          if (e.team === TEAM_PLAYER) addLog(`生产完成: ${def.desc}`);
        }
      }
      continue;
    }

    // -- 单位逻辑 --
    const def = UNIT_DEFS[e.type];
    const speed = def.speed;

    // 自动反击
    if (e.state === 'idle' || e.state === 'move') {
      const nearby = findNearestEnemy(e, def.range + 2);
      if (nearby && e.state === 'idle') {
        e.attackTarget = nearby.id;
        e.state = 'attack';
      }
    }

    switch (e.state) {
      case 'move': {
        if (!e.target) { e.state = 'idle'; break; }
        if (e.path.length > 0) {
          const arrived = followPath(e, speed);
          if (arrived) {
            e.state = 'idle';
            e.target = null;
          }
        } else {
          const arrived = moveToward(e, e.target.x, e.target.y, speed);
          if (arrived) {
            e.state = 'idle';
            e.target = null;
          }
        }
        break;
      }
      case 'attack': {
        const target = entities.find(t => t.id === e.attackTarget);
        if (!target || target.hp <= 0) {
          e.state = 'idle';
          e.attackTarget = null;
          e.path = [];
          break;
        }
        const d = dist(e, target);
        if (d > def.range * CELL) {
          // 远距离用A*寻路，每60帧重算一次
          if (e.path.length > 0) {
            followPath(e, speed);
          } else if (game.frame - e.pathRetryFrame > 60) {
            const tgx = Math.floor(target.x / CELL);
            const tgy = Math.floor(target.y / CELL);
            setUnitPath(e, tgx, tgy);
            e.pathRetryFrame = game.frame;
            if (e.path.length === 0) moveToward(e, target.x, target.y, speed);
          } else {
            moveToward(e, target.x, target.y, speed);
          }
        } else {
          e.path = [];
          if (game.frame % 20 === 0) {
            target.hp -= def.atk;
            if (target.hp <= 0) {
              addLog(`${def.char} 消灭了 ${target.kind === 'building' ? BUILDING_DEFS[target.type].char : UNIT_DEFS[target.type].char}`);
              e.state = 'idle';
              e.attackTarget = null;
              checkGameOver();
            }
          }
        }
        break;
      }
      case 'gather': {
        if (e.carrying >= GATHER_AMOUNT) {
          const base = findNearestBase(e.gx, e.gy, e.team);
          if (!base) { e.state = 'idle'; break; }
          const d = dist(e, base);
          if (d < CELL * 3) {
            if (e.team === TEAM_PLAYER) game.minerals += e.carrying;
            e.carrying = 0;
            e.gatherTimer = 0;
            e.path = [];
            const mineral = findNearestMineral(e.gx, e.gy);
            if (mineral) {
              e.gatherTarget = mineral;
              setUnitPath(e, mineral.gx, mineral.gy);
            } else {
              e.state = 'idle';
            }
          } else {
            if (e.path.length > 0) {
              followPath(e, speed);
            } else {
              const bgx = Math.floor(base.x / CELL);
              const bgy = Math.floor(base.y / CELL);
              setUnitPath(e, bgx, bgy);
              if (e.path.length === 0) moveToward(e, base.x, base.y, speed);
            }
          }
        } else if (e.gatherTarget) {
          const tx = e.gatherTarget.gx * CELL + CELL / 2;
          const ty = e.gatherTarget.gy * CELL + CELL / 2;
          const d = Math.sqrt((e.x - tx) ** 2 + (e.y - ty) ** 2);
          if (d < CELL) {
            e.gatherTimer++;
            if (e.gatherTimer >= GATHER_TIME) {
              e.carrying = GATHER_AMOUNT;
              e.path = [];
              if (mapData[e.gatherTarget.gy] && mapData[e.gatherTarget.gy][e.gatherTarget.gx] === 1) {
                if (Math.random() < 0.15) {
                  mapData[e.gatherTarget.gy][e.gatherTarget.gx] = 0;
                }
              }
            }
          } else {
            if (e.path.length > 0) {
              followPath(e, speed);
            } else {
              setUnitPath(e, e.gatherTarget.gx, e.gatherTarget.gy);
              if (e.path.length === 0) moveToward(e, tx, ty, speed);
            }
          }
        } else {
          e.state = 'idle';
        }
        break;
      }
      case 'build': {
        if (!e.buildTarget) { e.state = 'idle'; break; }
        const building = entities.find(b => b.id === e.buildTarget);
        if (!building || building.hp <= 0) { e.state = 'idle'; e.path = []; break; }
        const d = dist(e, building);
        if (d > CELL * 3) {
          if (e.path.length > 0) {
            followPath(e, speed);
          } else {
            const bgx = Math.floor(building.x / CELL);
            const bgy = Math.floor(building.y / CELL);
            setUnitPath(e, bgx, bgy);
            if (e.path.length === 0) moveToward(e, building.x, building.y, speed);
          }
        } else {
          e.path = [];
          building.buildProgress = Math.min(building.maxHp, building.buildProgress + 2);
          if (building.buildProgress >= building.maxHp) {
            addLog(`建筑完成: ${BUILDING_DEFS[building.type].desc}`);
            e.state = 'idle';
            e.buildTarget = null;
          }
        }
        break;
      }
    }
  }

  // 清除死亡实体
  for (let i = entities.length - 1; i >= 0; i--) {
    if (entities[i].hp <= 0) {
      const dead = entities[i];
      if (dead.kind === 'building') {
        const bDef = BUILDING_DEFS[dead.type];
        for (let dy = 0; dy < bDef.h; dy++) {
          for (let dx = 0; dx < bDef.w; dx++) {
            if (dead.gy + dy < MAP_H && dead.gx + dx < MAP_W) {
              mapData[dead.gy + dy][dead.gx + dx] = 0;
            }
          }
        }
      }
      entities.splice(i, 1);
    }
  }

  // 单位碰撞分离
  applyUnitSeparation();

  // 战争迷雾更新
  updateFog();

  countPop();

  // AI逻辑 (每120帧执行一次)
  if (game.frame % 120 === 0) enemyAI();

  updateHUD();
}

// ---- 战争迷雾 ----
// 每帧重算视野: 先将 VISIBLE 降级为 EXPLORED, 再用所有玩家实体重新点亮
const game_fogEnabled = true; // 调试可在 console 关闭: window.fogEnabled = false
window.fogEnabled = game_fogEnabled;

function updateFog() {
  if (!window.fogEnabled) {
    for (let y = 0; y < MAP_H; y++) {
      for (let x = 0; x < MAP_W; x++) fogMap[y][x] = FOG_VISIBLE;
    }
    return;
  }
  for (let y = 0; y < MAP_H; y++) {
    const row = fogMap[y];
    for (let x = 0; x < MAP_W; x++) {
      if (row[x] === FOG_VISIBLE) row[x] = FOG_EXPLORED;
    }
  }
  for (const e of entities) {
    if (e.team !== TEAM_PLAYER || e.hp <= 0) continue;
    let cx, cy, vision;
    if (e.kind === 'unit') {
      vision = UNIT_DEFS[e.type].vision || 5;
      cx = e.x / CELL;
      cy = e.y / CELL;
    } else {
      const bDef = BUILDING_DEFS[e.type];
      vision = bDef.vision || 4;
      cx = e.gx + bDef.w / 2;
      cy = e.gy + bDef.h / 2;
    }
    const vSq = vision * vision;
    const minX = Math.max(0, Math.floor(cx - vision));
    const maxX = Math.min(MAP_W - 1, Math.ceil(cx + vision));
    const minY = Math.max(0, Math.floor(cy - vision));
    const maxY = Math.min(MAP_H - 1, Math.ceil(cy + vision));
    for (let y = minY; y <= maxY; y++) {
      for (let x = minX; x <= maxX; x++) {
        const dx = x + 0.5 - cx;
        const dy = y + 0.5 - cy;
        if (dx * dx + dy * dy <= vSq) fogMap[y][x] = FOG_VISIBLE;
      }
    }
  }
}

// 初始化时立即计算一次视野, 避免开局第一帧前画面全黑
updateFog();

// ---- 敌方AI ----
function enemyAI() {
  const enemyUnits = entities.filter(e => e.team === TEAM_ENEMY && e.hp > 0 && e.kind === 'unit');
  const enemyBuildings = entities.filter(e => e.team === TEAM_ENEMY && e.hp > 0 && e.kind === 'building');
  const eBase = enemyBuildings.find(b => b.type === 'base');

  if (!eBase) return;

  const enemyWorkers = enemyUnits.filter(u => u.type === 'worker');
  const enemySoldiers = enemyUnits.filter(u => u.type !== 'worker');

  // 工人去采矿
  for (const w of enemyWorkers) {
    if (w.state === 'idle') {
      const mineral = findNearestMineral(w.gx, w.gy);
      if (mineral) {
        w.gatherTarget = mineral;
        w.state = 'gather';
        setUnitPath(w, mineral.gx, mineral.gy);
      }
    }
  }

  // 定期生产
  if (eBase.queue.length === 0 && eBase.buildProgress >= eBase.maxHp) {
    if (enemyWorkers.length < 3) {
      eBase.queue.push('worker');
    }
  }

  // 有兵营则生产战斗单位
  const eBarracks = enemyBuildings.find(b => b.type === 'barracks' && b.buildProgress >= b.maxHp);
  if (eBarracks && eBarracks.queue.length === 0) {
    eBarracks.queue.push(Math.random() < 0.5 ? 'soldier' : 'ranger');
  }

  // 建造兵营
  if (!enemyBuildings.find(b => b.type === 'barracks') && game.frame > 600) {
    const bx = eBase.gx + 4;
    const by = eBase.gy;
    if (bx + 1 < MAP_W && by + 1 < MAP_H) {
      const b = createBuilding('barracks', bx, by, TEAM_ENEMY);
      b.buildProgress = b.maxHp;
    }
  }

  // 进攻逻辑
  if (enemySoldiers.length >= 3) {
    const playerBuildings = entities.filter(e => e.team === TEAM_PLAYER && e.hp > 0);
    if (playerBuildings.length > 0) {
      const target = playerBuildings[0];
      for (const s of enemySoldiers) {
        if (s.state === 'idle') {
          s.attackTarget = target.id;
          s.state = 'attack';
          s.path = [];
          s.pathRetryFrame = 0;
        }
      }
      if (game.frame % 600 === 0) addLog('⚠️ 敌军发起进攻！');
    }
  }
}

function checkGameOver() {
  const playerBases = entities.filter(e => e.team === TEAM_PLAYER && e.kind === 'building' && e.type === 'base' && e.hp > 0);
  const enemyBases = entities.filter(e => e.team === TEAM_ENEMY && e.kind === 'building' && e.type === 'base' && e.hp > 0);
  if (playerBases.length === 0) {
    game.gameOver = true;
    addLog('💀 你的基地被摧毁了... 游戏结束！');
  }
  if (enemyBases.length === 0) {
    game.gameOver = true;
    addLog('🎉 恭喜！你消灭了敌方基地，胜利！');
  }
}

// ---- 渲染 ----
function render() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const startGX = Math.floor(camera.x / CELL);
  const startGY = Math.floor(camera.y / CELL);
  const endGX = Math.min(MAP_W, startGX + Math.ceil(canvas.width / CELL) + 1);
  const endGY = Math.min(MAP_H, startGY + Math.ceil(canvas.height / CELL) + 1);

  // 绘制网格和地形
  for (let gy = startGY; gy < endGY; gy++) {
    for (let gx = startGX; gx < endGX; gx++) {
      const sx = gx * CELL - camera.x;
      const sy = gy * CELL - camera.y;

      ctx.strokeStyle = '#1a1a1a';
      ctx.strokeRect(sx, sy, CELL, CELL);

      const tile = mapData[gy]?.[gx];
      if (tile === 1) {
        ctx.fillStyle = '#44f';
        ctx.font = `${CELL - 4}px Courier New`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('矿', sx + CELL / 2, sy + CELL / 2);
      } else if (tile === 2) {
        ctx.fillStyle = '#555';
        ctx.font = `${CELL - 4}px Courier New`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('岩', sx + CELL / 2, sy + CELL / 2);
      }
    }
  }

  // 战争迷雾遮罩 (绘制在地形之上, 实体之下)
  // - UNEXPLORED: 不透明黑色, 完全遮挡地形
  // - EXPLORED: 半透明黑色, 地形可见但暗淡
  if (window.fogEnabled) {
    for (let gy = startGY; gy < endGY; gy++) {
      for (let gx = startGX; gx < endGX; gx++) {
        const fog = fogMap[gy]?.[gx];
        if (fog === FOG_VISIBLE) continue;
        const fsx = gx * CELL - camera.x;
        const fsy = gy * CELL - camera.y;
        if (fog === FOG_UNEXPLORED) {
          ctx.fillStyle = '#000';
        } else { // FOG_EXPLORED
          ctx.fillStyle = 'rgba(0,0,0,0.55)';
        }
        ctx.fillRect(fsx, fsy, CELL, CELL);
      }
    }
  }

  // 绘制实体
  for (const e of entities) {
    if (e.hp <= 0) continue;
    const sx = e.x - camera.x;
    const sy = e.y - camera.y;

    if (sx < -CELL * 3 || sx > canvas.width + CELL * 3 || sy < -CELL * 3 || sy > canvas.height + CELL * 3) continue;

    // 战争迷雾: 敌方实体仅在视野格内才渲染 (建筑取中心格判断)
    if (e.team === TEAM_ENEMY) {
      let cgx, cgy;
      if (e.kind === 'building') {
        const bDef = BUILDING_DEFS[e.type];
        cgx = e.gx + Math.floor(bDef.w / 2);
        cgy = e.gy + Math.floor(bDef.h / 2);
      } else {
        cgx = Math.floor(e.x / CELL);
        cgy = Math.floor(e.y / CELL);
      }
      if (fogMap[cgy]?.[cgx] !== FOG_VISIBLE) continue;
    }

    if (e.kind === 'building') {
      const bDef = BUILDING_DEFS[e.type];
      const bx = e.gx * CELL - camera.x;
      const by = e.gy * CELL - camera.y;
      const bw = bDef.w * CELL;
      const bh = bDef.h * CELL;

      const alpha = e.buildProgress >= e.maxHp ? 0.3 : 0.15;
      ctx.fillStyle = e.team === TEAM_PLAYER ? `rgba(0,255,0,${alpha})` : `rgba(255,0,0,${alpha})`;
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = e.team === TEAM_PLAYER ? '#0a0' : '#a00';
      ctx.strokeRect(bx, by, bw, bh);

      const bColor = e.team === TEAM_PLAYER ? bDef.color : '#f44';
      ctx.fillStyle = bColor;
      ctx.font = `bold ${CELL}px Courier New`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const label = e.buildProgress < e.maxHp
        ? `${bDef.char}${Math.floor(e.buildProgress / e.maxHp * 100)}%`
        : bDef.char;
      ctx.fillText(label, bx + bw / 2, by + bh / 2);

      if (e.queue.length > 0) {
        const producing = e.queue[0];
        const uDef = UNIT_DEFS[producing];
        const pct = e.queueTimer / uDef.buildTime;
        ctx.fillStyle = '#030';
        ctx.fillRect(bx, by + bh + 2, bw, 4);
        ctx.fillStyle = '#0f0';
        ctx.fillRect(bx, by + bh + 2, bw * pct, 4);
      }

      drawHpBar(bx, by - 6, bw, e.hp, e.maxHp, e.team);
    } else {
      const uDef = UNIT_DEFS[e.type];
      const uColor = e.team === TEAM_PLAYER ? uDef.color : '#f44';

      if (game.selected.includes(e.id)) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sx, sy, CELL / 2 + 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = 1;
      }

      // 编队编号
      if (e.team === TEAM_PLAYER) {
        for (const [gNum, ids] of Object.entries(game.controlGroups)) {
          if (ids.includes(e.id)) {
            ctx.fillStyle = '#ff0';
            ctx.font = 'bold 10px Courier New';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(gNum, sx, sy - CELL / 2 - 1);
            break;
          }
        }
      }

      ctx.fillStyle = uColor;
      ctx.font = `bold ${CELL - 2}px Courier New`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(uDef.char, sx, sy);

      if (e.carrying > 0) {
        ctx.fillStyle = '#44f';
        ctx.font = '10px Courier New';
        ctx.fillText('◆', sx + 10, sy - 10);
      }

      if (e.state === 'gather') {
        ctx.fillStyle = '#0af';
        ctx.font = '9px Courier New';
        ctx.fillText('⛏', sx + 10, sy + 10);
      } else if (e.state === 'attack') {
        ctx.fillStyle = '#f00';
        ctx.font = '9px Courier New';
        ctx.fillText('⚔', sx + 10, sy + 10);
      } else if (e.state === 'build') {
        ctx.fillStyle = '#ff0';
        ctx.font = '9px Courier New';
        ctx.fillText('🔨', sx + 10, sy + 10);
      }

      drawHpBar(sx - CELL / 2, sy - CELL / 2 - 4, CELL, e.hp, e.maxHp, e.team);
    }
  }

  // 框选框
  if (game.dragStart && game.dragEnd) {
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    const rx = Math.min(game.dragStart.x, game.dragEnd.x);
    const ry = Math.min(game.dragStart.y, game.dragEnd.y);
    const rw = Math.abs(game.dragEnd.x - game.dragStart.x);
    const rh = Math.abs(game.dragEnd.y - game.dragStart.y);
    ctx.strokeRect(rx, ry, rw, rh);
    ctx.setLineDash([]);
  }

  // 建造预览
  if (game.buildMode && game.buildPreview) {
    const bDef = BUILDING_DEFS[game.buildMode];
    const bx = game.buildPreview.gx * CELL - camera.x;
    const by = game.buildPreview.gy * CELL - camera.y;
    const bw = bDef.w * CELL;
    const bh = bDef.h * CELL;
    const canBuild = canPlaceBuilding(game.buildMode, game.buildPreview.gx, game.buildPreview.gy);
    ctx.fillStyle = canBuild ? 'rgba(0,255,0,0.2)' : 'rgba(255,0,0,0.2)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = canBuild ? '#0f0' : '#f00';
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(bx, by, bw, bh);
    ctx.setLineDash([]);
    ctx.fillStyle = canBuild ? '#0f0' : '#f00';
    ctx.font = `bold ${CELL}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(bDef.char, bx + bw / 2, by + bh / 2);
  }

  // 游戏结束覆盖层
  if (game.gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 48px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const msg = entities.filter(e => e.team === TEAM_PLAYER && e.kind === 'building' && e.type === 'base' && e.hp > 0).length === 0
      ? '游戏失败' : '胜利！';
    ctx.fillText(msg, canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '20px Courier New';
    ctx.fillText('按 R 重新开始', canvas.width / 2, canvas.height / 2 + 30);
  }

  renderMinimap();
}

function drawHpBar(x, y, w, hp, maxHp, team) {
  if (hp >= maxHp) return;
  const pct = hp / maxHp;
  ctx.fillStyle = '#300';
  ctx.fillRect(x, y, w, 3);
  ctx.fillStyle = pct > 0.5 ? '#0f0' : pct > 0.25 ? '#ff0' : '#f00';
  ctx.fillRect(x, y, w * pct, 3);
}

function renderMinimap() {
  const mw = mmCanvas.width;
  const mh = mmCanvas.height;
  const sx = mw / MAP_W;
  const sy = mh / MAP_H;

  // 背景填黑 (未探索区域默认状态)
  mmCtx.fillStyle = '#000';
  mmCtx.fillRect(0, 0, mw, mh);

  // 地形 (只在 EXPLORED / VISIBLE 区域绘制)
  for (let gy = 0; gy < MAP_H; gy++) {
    for (let gx = 0; gx < MAP_W; gx++) {
      const fog = window.fogEnabled ? fogMap[gy][gx] : FOG_VISIBLE;
      if (fog === FOG_UNEXPLORED) continue;
      if (mapData[gy][gx] === 1) {
        mmCtx.fillStyle = '#00a';
        mmCtx.fillRect(gx * sx, gy * sy, sx, sy);
      } else if (mapData[gy][gx] === 2) {
        mmCtx.fillStyle = '#333';
        mmCtx.fillRect(gx * sx, gy * sy, sx, sy);
      }
    }
  }

  // 实体: 玩家实体始终显示, 敌方实体仅在 VISIBLE 格内显示
  for (const e of entities) {
    if (e.hp <= 0) continue;
    if (e.team === TEAM_ENEMY && window.fogEnabled) {
      const cgx = Math.floor(e.x / CELL);
      const cgy = Math.floor(e.y / CELL);
      if (fogMap[cgy]?.[cgx] !== FOG_VISIBLE) continue;
    }
    const ex = (e.x / CELL) * sx;
    const ey = (e.y / CELL) * sy;
    if (e.team === TEAM_PLAYER) {
      mmCtx.fillStyle = e.kind === 'building' ? '#0f0' : '#0a0';
    } else {
      mmCtx.fillStyle = e.kind === 'building' ? '#f00' : '#a00';
    }
    const size = e.kind === 'building' ? 4 : 2;
    mmCtx.fillRect(ex - size / 2, ey - size / 2, size, size);
  }

  // EXPLORED 区域叠加半透明遮罩 (visual cue 已探索但未点亮)
  if (window.fogEnabled) {
    mmCtx.fillStyle = 'rgba(0,0,0,0.45)';
    for (let gy = 0; gy < MAP_H; gy++) {
      for (let gx = 0; gx < MAP_W; gx++) {
        if (fogMap[gy][gx] === FOG_EXPLORED) {
          mmCtx.fillRect(gx * sx, gy * sy, sx, sy);
        }
      }
    }
  }

  const vx = (camera.x / (MAP_W * CELL)) * mw;
  const vy = (camera.y / (MAP_H * CELL)) * mh;
  const vw = (canvas.width / (MAP_W * CELL)) * mw;
  const vh = ((canvas.height - LOG_H) / (MAP_H * CELL)) * mh;
  mmCtx.strokeStyle = '#fff';
  mmCtx.lineWidth = 1;
  mmCtx.strokeRect(vx, vy, vw, vh);
}

// ---- UI更新 ----
function updateHUD() {
  document.getElementById('hudMinerals').textContent = game.minerals;
  document.getElementById('hudPop').textContent = `${game.pop}/${game.maxPop}`;
  document.getElementById('hudUnits').textContent = entities.filter(e => e.team === TEAM_PLAYER && e.hp > 0 && e.kind === 'unit').length;
  document.getElementById('hudEnemies').textContent = entities.filter(e => e.team === TEAM_ENEMY && e.hp > 0).length;
  document.getElementById('hudTime').textContent = formatTime(game.frame);
}

function updateGuide() {
  const guideEl = document.getElementById('guide');
  const row = (k, v) => `<div class="guide-row"><span class="guide-key">${k}</span><span class="guide-desc">${v}</span></div>`;
  let html = '';

  if (game.buildMode) {
    html += '<div class="guide-section">';
    html += row('左键', '放置建筑');
    html += row('右键/Esc', '取消建造');
    html += '</div>';
    guideEl.innerHTML = html;
    return;
  }

  const sel = game.selected.map(id => entities.find(e => e.id === id)).filter(Boolean);

  if (sel.length === 0) {
    html += '<div class="guide-section">';
    html += row('左键', '选中单位/建筑');
    html += row('左键拖拽', '框选多个单位');
    html += row('双击单位', '选择屏幕内同类型');
    html += row('Ctrl+点击', '选择屏幕内同类型');
    html += row('Ctrl+数字', '设置编队');
    html += row('Shift+数字', '追加编队');
    html += row('Alt+数字', '独占编队');
    html += row('数字键', '召回编队');
    html += row('Tab', '子组切换');
    html += row('WASD', '滚动地图');
    html += row('目标', '摧毁左上敌方基地');
    html += '</div>';
    guideEl.innerHTML = html;
    return;
  }

  const first = sel[0];
  html += '<div class="guide-section">';

  if (first.kind === 'building') {
    html += row('左键空地', '取消选中');
  } else if (first.kind === 'unit') {
    const hasWorker = sel.some(e => e.type === 'worker');
    html += row('右键空地', '移动');
    html += row('右键敌人', '攻击');
    if (hasWorker) html += row('右键矿石', '采矿');
    html += row('Ctrl+数字', '设置编队');
    html += row('Shift+数字', '追加编队');
    html += row('Alt+数字', '独占编队');
    html += row('Tab', '子组切换');
    html += row('左键空地', '取消选中');
  }

  html += row('WASD', '滚动地图');
  html += '</div>';
  guideEl.innerHTML = html;
}

function updateGroupBar() {
  const bar = document.getElementById('groupBar');
  let html = '';
  for (let i = 1; i <= 9; i++) {
    const ids = game.controlGroups[i];
    const alive = ids ? ids.filter(id => entities.find(e => e.id === id && e.hp > 0)) : [];
    if (ids) game.controlGroups[i] = alive;
    const hasUnits = alive.length > 0;
    const isSelected = hasUnits && alive.length === game.selected.length && alive.every(id => game.selected.includes(id));
    const cls = isSelected ? 'grp-btn selected' : (hasUnits ? 'grp-btn active' : 'grp-btn');
    const tip = hasUnits
      ? `${alive.length}个单位 | 右键:设置 Shift+右键:追加 Alt+右键:独占`
      : '右键:设置编队';
    const countTag = hasUnits ? `<span class="grp-count">${alive.length}</span>` : '';
    html += `<button class="${cls}" onclick="recallControlGroup(${i})" oncontextmenu="handleGroupBarRightClick(event,${i})" title="${tip}">${i}${countTag}</button>`;
  }
  bar.innerHTML = html;
}

function handleGroupBarRightClick(e, num) {
  e.preventDefault();
  e.stopPropagation();
  if (e.altKey) {
    stealControlGroup(num);
  } else if (e.shiftKey) {
    appendControlGroup(num);
  } else {
    assignControlGroup(num);
  }
}

function updateSidebar() {
  updateGuide();
  updateGroupBar();
  const infoEl = document.getElementById('info');
  const actionsEl = document.getElementById('actions');

  if (game.buildMode) {
    const bDef = BUILDING_DEFS[game.buildMode];
    infoEl.innerHTML = `<span style="color:#ff0">建造模式: ${bDef.desc}</span><br>左键放置 | 右键/Esc取消`;
    actionsEl.innerHTML = `<button class="btn" onclick="cancelBuild()">取消建造 [Esc]</button>`;
    return;
  }

  if (game.selected.length === 0) {
    infoEl.innerHTML = '未选中任何单位';
    actionsEl.innerHTML = '';
    return;
  }

  const selectedEntities = game.selected.map(id => entities.find(e => e.id === id)).filter(Boolean);
  if (selectedEntities.length === 0) {
    game.selected = [];
    infoEl.innerHTML = '未选中任何单位';
    actionsEl.innerHTML = '';
    return;
  }

  const first = selectedEntities[0];

  if (first.kind === 'building') {
    const bDef = BUILDING_DEFS[first.type];
    let html = `<span style="color:${bDef.color}">${bDef.char} ${bDef.desc}</span><br>`;
    html += `HP: ${first.hp}/${first.maxHp}<br>`;
    if (first.buildProgress < first.maxHp) {
      html += `建造中: ${Math.floor(first.buildProgress / first.maxHp * 100)}%`;
    }
    if (first.queue.length > 0) {
      html += `<br>生产中: ${UNIT_DEFS[first.queue[0]].char} (${first.queue.length}个排队)`;
    }
    infoEl.innerHTML = html;

    let btns = '';
    if (first.buildProgress >= first.maxHp && first.team === TEAM_PLAYER && bDef.produces) {
      const keyMap = { worker: '1', soldier: '1', ranger: '2', tank: '3' };
      for (const uType of bDef.produces) {
        const uDef = UNIT_DEFS[uType];
        const key = keyMap[uType] || '';
        btns += `<button class="btn" onclick="trainUnit('${uType}', ${first.id})">
          <span class="btn-key">[${key}]</span> ${uDef.char} ${uDef.desc} <span class="cost">${uDef.cost}矿</span>
        </button>`;
      }
    }
    actionsEl.innerHTML = btns;
  } else {
    if (selectedEntities.length === 1) {
      const uDef = UNIT_DEFS[first.type];
      let html = `<span style="color:${uDef.color}">${uDef.char} ${uDef.desc}</span><br>`;
      html += `HP: ${first.hp}/${first.maxHp}<br>`;
      html += `攻击: ${uDef.atk} | 射程: ${uDef.range}<br>`;
      html += `状态: ${first.state}`;
      if (first.carrying > 0) html += `<br>携带矿石: ${first.carrying}`;
      infoEl.innerHTML = html;
    } else {
      const counts = {};
      for (const e of selectedEntities) {
        counts[e.type] = (counts[e.type] || 0) + 1;
      }
      let html = `选中 ${selectedEntities.length} 个单位:<br>`;
      for (const [type, count] of Object.entries(counts)) {
        html += `${UNIT_DEFS[type].char} x${count} `;
      }
      infoEl.innerHTML = html;
    }

    let btns = '';
    const hasWorker = selectedEntities.some(e => e.type === 'worker');
    if (hasWorker) {
      const buildKeyMap = { barracks: '2', factory: '3', tower: '', supply: '4' };
      for (const [bType, bDef] of Object.entries(BUILDING_DEFS)) {
        if (bType === 'base') continue;
        const key = buildKeyMap[bType] || '';
        btns += `<button class="btn" onclick="startBuild('${bType}')" ${game.minerals < bDef.cost ? 'disabled' : ''}>
          ${key ? `<span class="btn-key">[${key}]</span> ` : ''}${bDef.char} ${bDef.desc} <span class="cost">${bDef.cost}矿</span>
        </button>`;
      }
    }
    actionsEl.innerHTML = btns;
  }
}

// ---- 操作命令 ----
function trainUnit(type, buildingId) {
  const building = entities.find(e => e.id === buildingId);
  if (!building) return;
  const uDef = UNIT_DEFS[type];
  if (game.minerals < uDef.cost) { addLog('矿石不足！'); return; }
  if (game.pop + uDef.popCost > game.maxPop) { addLog('人口上限！需要建造人口房。'); return; }
  game.minerals -= uDef.cost;
  building.queue.push(type);
  addLog(`开始生产: ${uDef.desc}`);
  updateSidebar();
}

function startBuild(type) {
  const bDef = BUILDING_DEFS[type];
  if (game.minerals < bDef.cost) { addLog('矿石不足！'); return; }
  game.buildMode = type;
  addLog(`进入建造模式: ${bDef.desc} - 左键放置`);
  updateSidebar();
}

function cancelBuild() {
  game.buildMode = null;
  game.buildPreview = null;
  updateSidebar();
}

function placeBuildingAtMouse(gx, gy) {
  if (!game.buildMode) return;
  if (!canPlaceBuilding(game.buildMode, gx, gy)) {
    addLog('无法在此处建造！');
    return;
  }
  const bDef = BUILDING_DEFS[game.buildMode];
  if (game.minerals < bDef.cost) { addLog('矿石不足！'); return; }
  game.minerals -= bDef.cost;
  const building = createBuilding(game.buildMode, gx, gy, TEAM_PLAYER);

  const workers = game.selected
    .map(id => entities.find(e => e.id === id))
    .filter(e => e && e.type === 'worker' && e.team === TEAM_PLAYER);
  if (workers.length > 0) {
    workers[0].state = 'build';
    workers[0].buildTarget = building.id;
  }

  addLog(`开始建造: ${bDef.desc}`);
  game.buildMode = null;
  game.buildPreview = null;
  updateSidebar();
}

// ---- 输入处理 ----
canvas.addEventListener('mousedown', (e) => {
  const mx = e.offsetX;
  const my = e.offsetY;

  if (e.button === 0) {
    if (game.buildMode) {
      const gx = Math.floor((mx + camera.x) / CELL);
      const gy = Math.floor((my + camera.y) / CELL);
      placeBuildingAtMouse(gx, gy);
      return;
    }
    game.dragStart = { x: mx, y: my };
    game.dragEnd = null;
  }
  if (e.button === 2) {
    e.preventDefault();
    if (game.buildMode) {
      cancelBuild();
      return;
    }
    issueCommand(mx, my);
  }
});

canvas.addEventListener('mousemove', (e) => {
  const mx = e.offsetX;
  const my = e.offsetY;

  if (game.buildMode) {
    game.buildPreview = {
      gx: Math.floor((mx + camera.x) / CELL),
      gy: Math.floor((my + camera.y) / CELL),
    };
  }

  if (game.dragStart) {
    game.dragEnd = { x: mx, y: my };
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (e.button === 0 && game.dragStart) {
    const mx = e.offsetX;
    const my = e.offsetY;
    const dx = Math.abs(mx - game.dragStart.x);
    const dy = Math.abs(my - game.dragStart.y);

    if (dx < 5 && dy < 5) {
      const gx = Math.floor((mx + camera.x) / CELL);
      const gy = Math.floor((my + camera.y) / CELL);

      // Double-click: select all same type on screen
      const now = Date.now();
      const isDoubleClick = (now - (game._lastClickTime || 0) < 400) &&
        Math.abs(mx - (game._lastClickX || 0)) < 10 &&
        Math.abs(my - (game._lastClickY || 0)) < 10;
      game._lastClickTime = now;
      game._lastClickX = mx;
      game._lastClickY = my;

      if (isDoubleClick) {
        const target = entityAt(gx, gy);
        if (target && target.team === TEAM_PLAYER && target.kind === 'unit') {
          if (!e.shiftKey) game.selected = [];
          for (const ent of entities) {
            if (ent.hp <= 0 || ent.team !== TEAM_PLAYER || ent.kind !== 'unit') continue;
            if (ent.type !== target.type) continue;
            const sx = ent.x - camera.x;
            const sy = ent.y - camera.y;
            if (sx >= -CELL && sx <= canvas.width + CELL && sy >= -CELL && sy <= canvas.height + CELL) {
              if (!game.selected.includes(ent.id)) game.selected.push(ent.id);
            }
          }
        }
      } else {
        selectAt(gx, gy, e.shiftKey, e.ctrlKey);
      }
    } else {
      boxSelect(game.dragStart, { x: mx, y: my }, e.shiftKey);
    }
    game.dragStart = null;
    game.dragEnd = null;
    updateSidebar();
  }
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function selectAt(gx, gy, additive, ctrlKey) {
  const target = entityAt(gx, gy);

  // Ctrl+click: select all same-type units on screen
  if (ctrlKey && target && target.team === TEAM_PLAYER && target.kind === 'unit') {
    if (!additive) game.selected = [];
    for (const e of entities) {
      if (e.hp <= 0 || e.team !== TEAM_PLAYER || e.kind !== 'unit') continue;
      if (e.type !== target.type) continue;
      // Check if on screen
      const sx = e.x - camera.x;
      const sy = e.y - camera.y;
      if (sx >= -CELL && sx <= canvas.width + CELL && sy >= -CELL && sy <= canvas.height + CELL) {
        if (!game.selected.includes(e.id)) game.selected.push(e.id);
      }
    }
    return;
  }

  if (!additive) game.selected = [];
  if (target && target.team === TEAM_PLAYER) {
    if (!game.selected.includes(target.id)) {
      game.selected.push(target.id);
    }
  }

  // Reset sub-group state on new selection
  game._subGroupType = null;
  game._fullSelection = null;
}

function boxSelect(start, end, additive) {
  const x1 = Math.min(start.x, end.x) + camera.x;
  const y1 = Math.min(start.y, end.y) + camera.y;
  const x2 = Math.max(start.x, end.x) + camera.x;
  const y2 = Math.max(start.y, end.y) + camera.y;

  if (!additive) game.selected = [];

  for (const e of entities) {
    if (e.hp <= 0 || e.team !== TEAM_PLAYER || e.kind !== 'unit') continue;
    if (e.x >= x1 && e.x <= x2 && e.y >= y1 && e.y <= y2) {
      if (!game.selected.includes(e.id)) game.selected.push(e.id);
    }
  }
}

function issueCommand(mx, my) {
  if (game.selected.length === 0) return;

  const gx = Math.floor((mx + camera.x) / CELL);
  const gy = Math.floor((my + camera.y) / CELL);

  const selectedUnits = game.selected
    .map(id => entities.find(e => e.id === id))
    .filter(e => e && e.kind === 'unit' && e.team === TEAM_PLAYER);

  if (selectedUnits.length === 0) return;

  const target = entityAt(gx, gy);

  if (target && target.team === TEAM_ENEMY) {
    for (const u of selectedUnits) {
      u.state = 'attack';
      u.attackTarget = target.id;
      u.path = [];
      u.pathRetryFrame = 0;
    }
    addLog(`⚔️ 命令攻击!`);
    return;
  }

  if (mapData[gy]?.[gx] === 1) {
    for (const u of selectedUnits) {
      if (u.type === 'worker') {
        u.state = 'gather';
        u.gatherTarget = { gx, gy };
        u.gatherTimer = 0;
        setUnitPath(u, gx, gy);
      }
    }
    addLog('⛏️ 前往采矿');
    return;
  }

  if (target && target.kind === 'building' && target.team === TEAM_PLAYER && target.buildProgress < target.maxHp) {
    for (const u of selectedUnits) {
      if (u.type === 'worker') {
        u.state = 'build';
        u.buildTarget = target.id;
        const bgx = Math.floor(target.x / CELL);
        const bgy = Math.floor(target.y / CELL);
        setUnitPath(u, bgx, bgy);
      }
    }
    addLog('🔨 前往建造');
    return;
  }

  const count = selectedUnits.length;
  const cols = Math.ceil(Math.sqrt(count));
  selectedUnits.forEach((u, i) => {
    const row = Math.floor(i / cols);
    const col = i % cols;
    const tgx = gx + col;
    const tgy = gy + row;
    u.state = 'move';
    u.target = {
      x: tgx * CELL + CELL / 2,
      y: tgy * CELL + CELL / 2,
    };
    setUnitPath(u, tgx, tgy);
    u.attackTarget = null;
    u.gatherTarget = null;
  });
}

// 小地图点击
mmCanvas.addEventListener('click', (e) => {
  const rect = mmCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  camera.x = (mx / mmCanvas.width) * MAP_W * CELL - canvas.width / 2;
  camera.y = (my / mmCanvas.height) * MAP_H * CELL - canvas.height / 2;
  clampCamera();
});

// ---- 编队系统 ----
function assignControlGroup(num) {
  if (game.selected.length === 0) return;
  game.controlGroups[num] = [...game.selected];
  addLog(`编队 ${num}: ${game.selected.length} 个单位`);
  updateSidebar();
  flashGroupButton(num);
}

function appendControlGroup(num) {
  if (game.selected.length === 0) return;
  if (!game.controlGroups[num]) game.controlGroups[num] = [];
  for (const id of game.selected) {
    if (!game.controlGroups[num].includes(id)) {
      game.controlGroups[num].push(id);
    }
  }
  addLog(`追加编队 ${num}: +${game.selected.length}`);
  updateSidebar();
  flashGroupButton(num);
}

function stealControlGroup(num) {
  if (game.selected.length === 0) return;
  // Remove selected units from all other groups
  for (let i = 1; i <= 9; i++) {
    if (i === num || !game.controlGroups[i]) continue;
    game.controlGroups[i] = game.controlGroups[i].filter(id => !game.selected.includes(id));
  }
  game.controlGroups[num] = [...game.selected];
  addLog(`独占编队 ${num}: ${game.selected.length} 个单位`);
  updateSidebar();
  flashGroupButton(num);
}

function flashGroupButton(num) {
  const btn = document.querySelector(`#groupBar button:nth-child(${num})`);
  if (btn) {
    btn.classList.remove('flash');
    void btn.offsetWidth;
    btn.classList.add('flash');
  }
}

function recallControlGroup(num) {
  const ids = game.controlGroups[num];
  if (!ids || ids.length === 0) return false;
  const alive = ids.filter(id => entities.find(e => e.id === id && e.hp > 0));
  game.controlGroups[num] = alive;
  if (alive.length === 0) return false;
  game.selected = [...alive];
  const units = alive.map(id => entities.find(e => e.id === id)).filter(Boolean);
  const cx = units.reduce((s, u) => s + u.x, 0) / units.length;
  const cy = units.reduce((s, u) => s + u.y, 0) / units.length;
  camera.x = cx - canvas.width / 2;
  camera.y = cy - canvas.height / 2;
  clampCamera();
  updateSidebar();
  return true;
}

// ---- 子组切换 (Tab) ----
function cycleSubGroup() {
  // Use stored full selection if available (after first Tab), otherwise current selection
  const sourceIds = game._fullSelection || game.selected;
  const selEntities = sourceIds
    .map(id => entities.find(e => e.id === id))
    .filter(e => e && e.hp > 0);
  if (selEntities.length === 0) return;

  // Group by type
  const types = [...new Set(selEntities.map(e => e.type))];
  if (types.length <= 1) return; // only one type, nothing to cycle

  // Store the full selection on first Tab press
  if (!game._fullSelection) game._fullSelection = [...game.selected];

  // Find current sub-group type and advance
  const currentType = game._subGroupType || null;
  let nextIdx = 0;
  if (currentType) {
    const curIdx = types.indexOf(currentType);
    nextIdx = (curIdx + 1) % types.length;
  }
  game._subGroupType = types[nextIdx];

  // Select only units of this type from the full selection
  const subIds = selEntities.filter(e => e.type === game._subGroupType).map(e => e.id);
  game.selected = subIds;
  addLog(`子组: ${UNIT_DEFS[game._subGroupType]?.desc || game._subGroupType}`);
  updateSidebar();
}

// 键盘
window.addEventListener('keydown', (e) => {
  game.keysDown[e.key] = true;

  if (e.key === 'Escape') cancelBuild();

  // Use e.code for modifier combos since Shift/Alt change e.key (e.g. Shift+3 → '#')
  let numKey = parseInt(e.key);
  if (isNaN(numKey) && e.code && e.code.startsWith('Digit')) {
    numKey = parseInt(e.code.charAt(5));
  }
  const isNum = numKey >= 1 && numKey <= 9;

  // Ctrl+数字: 分配编队
  if (isNum && e.ctrlKey) {
    e.preventDefault();
    assignControlGroup(numKey);
    return;
  }

  // Shift+数字: 追加到编队
  if (isNum && e.shiftKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    appendControlGroup(numKey);
    return;
  }

  // Alt+数字: 独占编队（steal）
  if (isNum && e.altKey && !e.ctrlKey) {
    e.preventDefault();
    stealControlGroup(numKey);
    return;
  }

  // Tab: 子组切换
  if (e.key === 'Tab' && game.selected.length > 0) {
    e.preventDefault();
    cycleSubGroup();
    return;
  }

  // 数字键: 先尝试原有快捷键，无效则召回编队
  if (isNum && !e.ctrlKey && !e.shiftKey && !e.altKey) {
    const sel = game.selected.map(id => entities.find(en => en.id === id)).filter(Boolean);
    const selBuilding = sel.find(s => s.kind === 'building' && s.team === TEAM_PLAYER);
    const hasWorker = sel.some(s => s.type === 'worker' && s.team === TEAM_PLAYER);
    let handled = false;

    if (numKey === 1) {
      if (selBuilding && selBuilding.type === 'base') { trainUnit('worker', selBuilding.id); handled = true; }
      else if (selBuilding && selBuilding.type === 'barracks') { trainUnit('soldier', selBuilding.id); handled = true; }
    }
    if (numKey === 2) {
      if (hasWorker) { startBuild('barracks'); handled = true; }
      else if (selBuilding && selBuilding.type === 'barracks') { trainUnit('ranger', selBuilding.id); handled = true; }
    }
    if (numKey === 3) {
      if (hasWorker) { startBuild('factory'); handled = true; }
      else if (selBuilding && selBuilding.type === 'factory') { trainUnit('tank', selBuilding.id); handled = true; }
    }
    if (numKey === 4) {
      if (hasWorker) { startBuild('supply'); handled = true; }
    }

    if (!handled) recallControlGroup(numKey);
    return;
  }

  if (e.key === 'r' && game.gameOver) location.reload();
});

window.addEventListener('keyup', (e) => {
  game.keysDown[e.key] = false;
});

// ---- 主循环 ----
function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

updateSidebar();
gameLoop();
</script>
